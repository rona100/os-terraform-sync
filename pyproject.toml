[project]
name = "oasis-terraform-sync"
version = "0.1.0"
description = "Bridges Terraform-managed identity resources with the Oasis Platform (PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "uvicorn==0.30.6",
]

[project.scripts]
oasis-sync = "oasis_bridge.sync_cli:main"
oasis-gate = "oasis_bridge.gate_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oasis_bridge", "mock_oasis"]
